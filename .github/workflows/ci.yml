name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start production server
        run: |
          npm run start &
          echo $! > /tmp/abc-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/health >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become ready"
          exit 1

      - name: Route & navigation smoke
        run: npm run smoke
        env:
          ABC_BASE: http://127.0.0.1:4000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive viewport matrix
        run: npm run test:responsive
        env:
          ABC_BASE: http://127.0.0.1:4000

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/abc-server.pid ]; then
            kill "$(cat /tmp/abc-server.pid)" || true
          fi
